name: ssh-root-key-cleanup

# One-off, manual-only tool (PX0 follow-up, 2026-09-28): remove the OLD
# LightsailDefaultKeyPair line from /root/.ssh/authorized_keys by exact
# fingerprint, delete ~ubuntu/.ssh/authorized_keys.bak-rotate-*, and verify.
# sshd config is only READ (sshd -T / sshd -t), never changed.
# Prints fingerprints / types / comments / option names / counts only.
# To be removed by a follow-up PR.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "check (read-only) | apply | verify (deploy-key SSH check)"
        required: true
        type: choice
        options: [check, apply, verify]
      old_fingerprint:
        description: "SHA256 fingerprint of the OLD key to remove from /root/.ssh/authorized_keys"
        required: false
        default: ""
      deploy_fingerprint:
        description: "SHA256 fingerprint the deploy user's authorized_keys must hold (only)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate inputs and prepare deploy key
        id: prep
        env:
          ACTION: ${{ inputs.action }}
          OLD_FP: ${{ inputs.old_fingerprint }}
          DEPLOY_FP: ${{ inputs.deploy_fingerprint }}
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
        run: |
          set -euo pipefail
          [ -n "${SSH_KEY:-}" ] || { echo "::error::LIGHTSAIL_SSH_KEY is empty"; exit 1; }
          for v in "$OLD_FP" "$DEPLOY_FP"; do
            [ -z "$v" ] || printf '%s' "$v" | grep -Eq '^SHA256:[A-Za-z0-9+/]{43}$' || { echo "::error::fingerprints must be SHA256:<43 chars>"; exit 1; }
          done
          if [ "$ACTION" = apply ]; then
            [ -n "$OLD_FP" ] && [ -n "$DEPLOY_FP" ] || { echo "::error::apply needs old_fingerprint and deploy_fingerprint"; exit 1; }
            [ "$OLD_FP" != "$DEPLOY_FP" ] || { echo "::error::old and deploy fingerprints are equal"; exit 1; }
          fi
          ( umask 077; printf '%s\n' "$SSH_KEY" | tr -d '\r' > "${RUNNER_TEMP}/k" )
          IN_USE_FP="$(ssh-keygen -y -f "${RUNNER_TEMP}/k" | ssh-keygen -lf - | awk '{print $2}')"
          echo "deploy key in use: $(ssh-keygen -y -f "${RUNNER_TEMP}/k" | ssh-keygen -lf - | awk '{print $1, $2, $NF}')"
          [ "$ACTION" != apply ] || [ "$IN_USE_FP" = "$DEPLOY_FP" ] || { echo "::error::LIGHTSAIL_SSH_KEY is not the expected deploy key"; exit 1; }
          echo "in_use_fp=$IN_USE_FP" >> "$GITHUB_OUTPUT"

      - name: Run on the Lightsail host
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
          ACTION: ${{ inputs.action }}
          OLD_FP: ${{ inputs.old_fingerprint }}
          DEPLOY_FP: ${{ inputs.deploy_fingerprint }}
          IN_USE_FP: ${{ steps.prep.outputs.in_use_fp }}
        run: |
          set -euo pipefail
          SSH_HOST="${LIGHTSAIL_HOST:-zorg.artof.link}"
          SSH_USER="${LIGHTSAIL_USER:-ubuntu}"
          mkdir -p "${HOME}/.ssh" && chmod 700 "${HOME}/.ssh"
          ssh-keyscan -H "$SSH_HOST" >> "${HOME}/.ssh/known_hosts" 2>/dev/null || true
          ssh -i "${RUNNER_TEMP}/k" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 \
              -o StrictHostKeyChecking=accept-new "${SSH_USER}@${SSH_HOST}" \
              "bash -s -- '$ACTION' '${OLD_FP:-none}' '${DEPLOY_FP:-none}' '$IN_USE_FP'" <<'REMOTE'
          set -euo pipefail
          ACTION=$1; OLD_FP=$2; DEPLOY_FP=$3; IN_USE_FP=$4
          AK="$HOME/.ssh/authorized_keys"
          RAK=/root/.ssh/authorized_keys
          WORK=$(mktemp -d); chmod 700 "$WORK"; trap 'rm -rf "$WORK"' EXIT
          fp_of() { printf '%s\n' "$1" > "$WORK/l"; ssh-keygen -lf "$WORK/l" 2>/dev/null | awk '{print $2}'; }
          optnames() {
            python3 -c '
          import re, sys
          line = sys.argv[1]
          m = re.search(r"(^|\s)(ssh-(rsa|ed25519|dss)|ecdsa-sha2-\S+|sk-\S+) AAAA", line)
          pre = line[:m.start()].strip() if m else ""
          if pre:
              parts, cur, q = [], "", False
              for ch in pre:
                  if ch == "\"": q = not q
                  if ch == "," and not q: parts.append(cur); cur = ""
                  else: cur += ch
              parts.append(cur)
              print(" [options: " + ",".join(p.split("=", 1)[0].strip() for p in parts if p.strip()) + "]", end="")
          ' "$1"
          }
          list() { # stdin: authorized_keys content -> fingerprint/type/comment per line, or "empty"
            local n=0 line out
            while IFS= read -r line || [ -n "$line" ]; do
              n=$((n+1))
              case "$line" in ''|'#'*) echo "  line $n: (blank or comment line)"; continue;; esac
              printf '%s\n' "$line" > "$WORK/l"
              out=$(ssh-keygen -lf "$WORK/l" 2>/dev/null || echo "unparseable line")
              echo "  line $n: $out$(optnames "$line")"
            done
            [ "$n" -gt 0 ] || echo "  empty"
          }
          keylines() { grep -cvE '^[[:space:]]*(#|$)' || true; }
          rmeta() { sudo -n stat -c '%A %U:%G inode=%i size=%s' "$1"; }

          ca_check() { # prints the browser-SSH related sshd state; returns 1 if the CA path is not intact
            local label=$1 ok=0 T ca P PC
            echo "== [$label] sshd / Lightsail browser-SSH checks (read-only)"
            sudo -n sshd -t && echo "  sshd -t: config OK" || { echo "  sshd -t: FAILED"; ok=1; }
            T=$(sudo -n sshd -T 2>/dev/null)
            ca=$(printf '%s\n' "$T" | awk '$1=="trustedusercakeys"{print $2}')
            P=$(printf '%s\n' "$T" | awk '$1=="authorizedprincipalsfile"{print $2}')
            PC=$(printf '%s\n' "$T" | awk '$1=="authorizedprincipalscommand"{print $2}')
            printf '%s\n' "$T" | grep -E '^(trustedusercakeys|authorizedprincipalsfile|authorizedprincipalscommand|authorizedprincipalscommanduser|authorizedkeysfile|pubkeyauthentication|permitrootlogin) ' | sed 's/^/  /'
            printf '%s\n' "$T" | awk '$1=="casignaturealgorithms"{print "  casignaturealgorithms includes ssh-rsa: " ($2 ~ /(^|,)ssh-rsa(,|$)/ ? "yes" : "no")}'
            printf '%s\n' "$T" | awk '$1=="pubkeyacceptedalgorithms"{print "  pubkeyacceptedalgorithms includes ssh-rsa-cert-v01: " ($2 ~ /ssh-rsa-cert-v01@openssh.com/ ? "yes" : "no")}'
            if [ -z "$ca" ] || [ "$ca" = none ]; then echo "  TrustedUserCAKeys: NOT SET"; ok=1
            elif sudo -n test -f "$ca" && sudo -n test -r "$ca"; then
              echo "  CA file $ca: exists, readable by root ($(sudo -n stat -c '%A %U:%G' "$ca"), sha256 $(sudo -n sha256sum "$ca" | cut -c1-16)…)"
              sudo -n cat "$ca" | list | sed 's/^/  CA key/'
              [ "$(sudo -n cat "$ca" | keylines)" -ge 1 ] || { echo "  CA file has no keys"; ok=1; }
              echo "CAHASH=$(sudo -n sha256sum "$ca" | cut -d' ' -f1)" > "$WORK/ca.$label"
            else echo "  CA file $ca: MISSING or unreadable"; ok=1; fi
            if [ "${P:-none}" != none ]; then
              pf=${P//%u/ubuntu}; pf=${pf//%h//home/ubuntu}; pf=${pf//%%/%}
              case "$pf" in /*) ;; *) pf="/home/ubuntu/$pf";; esac
              sudo -n test -f "$pf" && echo "  AuthorizedPrincipalsFile for ubuntu: $pf present ($(sudo -n wc -l < "$pf") lines)" || { echo "  AuthorizedPrincipalsFile for ubuntu: $pf MISSING"; ok=1; }
            else echo "  AuthorizedPrincipalsFile: none (cert principals must include the login user)"; fi
            [ "${PC:-none}" = none ] || echo "  AuthorizedPrincipalsCommand configured: $PC"
            echo "SSHDT=$(printf '%s\n' "$T" | grep -E '^(trustedusercakeys|authorizedprincipalsfile|authorizedprincipalscommand|authorizedprincipalscommanduser|casignaturealgorithms|pubkeyacceptedalgorithms) ' | sha256sum | cut -c1-16)" >> "$WORK/ca.$label"
            echo "  result: $([ $ok = 0 ] && echo INTACT || echo NOT-INTACT)"
            return $ok
          }
          deploy_readback() {
            echo "== ~ubuntu/.ssh (names only): $(ls -A "$HOME/.ssh" | tr '\n' ' ')"
            echo "== ~ubuntu/.ssh/authorized_keys ($(stat -c '%A %U:%G inode=%i' "$AK")):"
            list < "$AK"
          }
          echo "host user: $(id -un); deploy key in use: $IN_USE_FP"

          case "$ACTION" in
          check)
            ca_check before || true
            echo "== /root/.ssh/authorized_keys ($(rmeta "$RAK")):"; sudo -n cat "$RAK" | list
            deploy_readback
            ;;
          verify)
            n=0; ok=0
            while IFS= read -r line || [ -n "$line" ]; do case "$line" in ''|'#'*) continue;; esac
              n=$((n+1)); [ "$(fp_of "$line")" = "$IN_USE_FP" ] && ok=1; done < "$AK"
            [ $ok = 1 ] || { echo "::error::deploy key not in authorized_keys"; exit 1; }
            echo "verify: SSH login with the deploy key works (whoami=$(whoami)); key lines in authorized_keys: $n"
            deploy_readback
            ;;
          apply)
            ca_check before || { echo "::error::browser-SSH CA path not intact BEFORE changes; nothing changed"; exit 1; }
            echo "== /root/.ssh/authorized_keys BEFORE ($(rmeta "$RAK")):"; sudo -n cat "$RAK" | list
            PRE=$(sudo -n stat -c '%a %U:%G %i' "$RAK")
            # 1. root authorized_keys: drop only lines whose fingerprint == OLD_FP (file rewritten in place)
            sudo -n cat "$RAK" > "$WORK/root.in"
            : > "$WORK/root.out"; removed=0; kept=0
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in ''|'#'*) printf '%s\n' "$line" >> "$WORK/root.out"; continue;; esac
              if [ "$(fp_of "$line")" = "$OLD_FP" ]; then removed=$((removed+1)); else kept=$((kept+1)); printf '%s\n' "$line" >> "$WORK/root.out"; fi
            done < "$WORK/root.in"
            total=$(keylines < "$WORK/root.in")
            if [ "$removed" -eq 0 ]; then echo "root: OLD key not present, no change"
            else
              [ $((removed + kept)) -eq "$total" ] || { echo "::error::root line accounting mismatch; unchanged"; exit 1; }
              if [ "$kept" -eq 0 ] && ! grep -qvE '^[[:space:]]*$' "$WORK/root.out"; then
                sudo -n sh -c ": > $RAK"          # keep as an empty file (same inode)
              else
                sudo -n sh -c "cat '$WORK/root.out' > $RAK"   # same inode, mode, owner
              fi
              POST=$(sudo -n stat -c '%a %U:%G %i' "$RAK")
              [ "$PRE" = "$POST" ] && echo "root: removed $removed line(s) with $OLD_FP; kept $kept key line(s); mode/owner/inode unchanged ($POST)" \
                || { echo "::error::root authorized_keys metadata changed ($PRE -> $POST)"; exit 1; }
            fi
            echo "== /root/.ssh/authorized_keys AFTER ($(rmeta "$RAK")):"; sudo -n cat "$RAK" | list
            # 2. deploy user's rotation backups
            shopt -s nullglob; bks=("$HOME"/.ssh/authorized_keys.bak-rotate-*); shopt -u nullglob
            echo "backups found: ${#bks[@]}"
            for f in "${bks[@]}"; do
              if command -v shred >/dev/null 2>&1; then shred -u "$f"; m=shred; else rm -f "$f"; m=rm; fi
              echo "  deleted ($m): $(basename "$f")"
            done
            deploy_readback
            n=0; only=1
            while IFS= read -r line || [ -n "$line" ]; do case "$line" in ''|'#'*) continue;; esac
              n=$((n+1)); [ "$(fp_of "$line")" = "$DEPLOY_FP" ] || only=0; done < "$AK"
            [ "$n" = 1 ] && [ "$only" = 1 ] && echo "deploy authorized_keys holds only $DEPLOY_FP: yes" \
              || echo "::warning::deploy authorized_keys: key lines=$n only_deploy_key=$only"
            ca_check after || echo "::error::browser-SSH CA path check failed AFTER"
            cmp -s "$WORK/ca.before" "$WORK/ca.after" && echo "CA file + sshd principal/CA settings unchanged before vs after: yes" \
              || { echo "::error::CA/sshd settings differ before vs after"; exit 1; }
            ;;
          esac
          REMOTE

      - name: Clean up key file
        if: always()
        run: shred -u "${RUNNER_TEMP}/k" 2>/dev/null || rm -f "${RUNNER_TEMP}/k"
