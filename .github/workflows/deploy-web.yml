name: deploy-web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # Keep in sync with apps/web/Dockerfile COPY inputs.
      - "apps/web/**"
      - "packages/engine/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "deploy/**"
      - ".github/workflows/deploy-web.yml"

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  redeploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Require deploy secrets
        env:
          LIGHTSAIL_SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          GRAFANA_SECRET_KEY: ${{ secrets.GRAFANA_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${LIGHTSAIL_SSH_KEY:-}" ]; then
            echo "::error::LIGHTSAIL_SSH_KEY is not set. Add the Lightsail private key PEM under Settings → Secrets and variables → Actions. Optional secrets: LIGHTSAIL_HOST (default zorg.artof.link), LIGHTSAIL_USER (default ubuntu). Do not invent or commit credentials."
            exit 1
          fi
          if [ -z "${GRAFANA_ADMIN_PASSWORD:-}" ]; then
            echo "::error::GRAFANA_ADMIN_PASSWORD is not set. Add a strong random Grafana admin password under Settings → Secrets and variables → Actions. Do not commit it."
            exit 1
          fi
          if [ -z "${GRAFANA_SECRET_KEY:-}" ]; then
            echo "::error::GRAFANA_SECRET_KEY is not set. Add a random Grafana secret_key (e.g. 64 hex chars) under Settings → Secrets and variables → Actions. Do not commit it."
            exit 1
          fi

      - name: Redeploy web and Grafana on Lightsail
        env:
          LIGHTSAIL_SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          GRAFANA_SECRET_KEY: ${{ secrets.GRAFANA_SECRET_KEY }}
        run: |
          set -euo pipefail
          SSH_HOST="${LIGHTSAIL_HOST:-zorg.artof.link}"
          SSH_USER="${LIGHTSAIL_USER:-ubuntu}"
          KEY_FILE="${RUNNER_TEMP}/lightsail_ssh_key"
          printf '%s\n' "$LIGHTSAIL_SSH_KEY" | tr -d '\r' > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          mkdir -p "${HOME}/.ssh"
          chmod 700 "${HOME}/.ssh"
          ssh-keyscan -H "$SSH_HOST" >> "${HOME}/.ssh/known_hosts" 2>/dev/null || true
          remote() {
            ssh -i "$KEY_FILE" \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              -o ConnectTimeout=20 \
              -o StrictHostKeyChecking=accept-new \
              "${SSH_USER}@${SSH_HOST}" "$@"
          }
          echo "Redeploying on ${SSH_USER}@${SSH_HOST}"

          # 1. Deliver the Grafana admin password and secret_key over SSH stdin
          #    (never on a command line, never echoed) into a root-only staging
          #    file. deploy-host.sh moves it to /etc/zorg/grafana.env (read by
          #    compose.prod.yaml via env_file) after checking that a changed
          #    secret_key is safe to apply.
          printf 'GF_SECURITY_ADMIN_PASSWORD=%s\nGF_SECURITY_SECRET_KEY=%s\n' "$GRAFANA_ADMIN_PASSWORD" "$GRAFANA_SECRET_KEY" \
            | remote 'sudo install -d -m 700 -o root -g root /etc/zorg && sudo sh -c "umask 077; cat > /etc/zorg/grafana.env.new" && sudo chown root:root /etc/zorg/grafana.env.new && sudo chmod 600 /etc/zorg/grafana.env.new'

          # 2. Update the checkout, then run the host-side deploy steps from it
          #    (deploy/scripts/deploy-host.sh): build web, validate the
          #    Caddyfile, back up grafana.db, stage the env file, apply the
          #    compose changes, wait for Grafana on 127.0.0.1:3000,
          #    re-apply the admin password from the env file (stdin only), and
          #    verify an admin login over the host-local (SSH-tunnel) path.
          remote 'cd /opt/zorg && sudo git fetch && sudo git reset --hard origin/main && sudo bash deploy/scripts/deploy-host.sh'

      - name: Probe public Grafana surface
        # Anonymous dashboard + queries must work; login form, admin API and
        # any credentialed request must be refused. Dummy credentials only.
        run: bash deploy/scripts/probe-public-grafana.sh "https://zorg.artof.link/grafana"
