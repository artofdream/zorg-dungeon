name: deploy-knowledge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "GAME_SPEC.md"
      - "AGENTS.md"
      - "apps/knowledge/**"
      - ".github/workflows/knowledge.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build knowledge site
        run: node apps/knowledge/scripts/build.mjs
      # CF-004: Pages must already exist with build_type=workflow.
      # enablement: true is hardening (create-if-missing needs a token other
      # than GITHUB_TOKEN; the default token cannot create a Pages site).
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "apps/knowledge/dist"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
