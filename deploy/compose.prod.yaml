services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # Access logs (rotated by Caddy, <=14 days; contain client IPs)
      - caddy_logs:/var/log/caddy
    depends_on:
      - web
      - grafana

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    expose:
      - "80"

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    expose:
      - "9090"

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
      # Server + request logs (daily rotation, <=14 days; contain client IPs)
      - grafana_logs:/var/log/grafana
    environment:
      - GF_SERVER_ROOT_URL=https://zorg.artof.link/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      # The login form stays enabled for admins on the SSH tunnel; Caddy
      # refuses /grafana/login and any credentialed request publicly.
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      # No basic-auth API logins at all (public or tunnel). The deploy's
      # `grafana cli admin reset-admin-password` does not use HTTP.
      - GF_AUTH_BASIC_ENABLED=false
      - GF_USERS_ALLOW_SIGN_UP=false
      # Logs to stdout AND /var/log/grafana/grafana.log (grafana_logs volume),
      # rotated daily, 14 days kept. Router logging records every request,
      # including admin traffic over the SSH tunnel that bypasses Caddy.
      - GF_LOG_MODE=console file
      - GF_LOG_FILE_DAILY_ROTATE=true
      - GF_LOG_FILE_MAX_DAYS=14
      - GF_SERVER_ROUTER_LOGGING=true
    # Admin password is NOT committed. deploy-web writes it from the
    # GRAFANA_ADMIN_PASSWORD repo secret to a root-only env file on the host
    # (GF_SECURITY_ADMIN_PASSWORD=...) and resets the admin password in
    # Grafana's DB on each deploy. Optional so local `docker compose` runs
    # still start without the file.
    env_file:
      - path: /etc/zorg/grafana.env
        required: false
    expose:
      - "3000"
    # Host-local only, for admin access over an SSH tunnel
    # (ssh -L 3000:127.0.0.1:3000 ...). Never publish on 0.0.0.0.
    ports:
      - "127.0.0.1:3000:3000"

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.8.2
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    expose:
      - "9100"

volumes:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
  caddy_logs:
  grafana_logs:
