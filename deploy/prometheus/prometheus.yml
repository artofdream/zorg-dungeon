global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "caddy"
    # Caddy's dedicated metrics listener (internal network only); the admin
    # API on :2019 is bound to localhost inside the Caddy container.
    static_configs:
      - targets: ["caddy:9180"]
