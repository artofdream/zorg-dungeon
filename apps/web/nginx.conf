server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Health check endpoint
    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK";
    }

    # SPA routing fallback. HTML always revalidates (ETag/Last-Modified):
    # with no Cache-Control a browser may reuse a stale index.html on its own
    # heuristics, e.g. the SPA it got for /godot/ before Caddy routed it.
    # Hashed assets below keep their 1-year cache.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}
