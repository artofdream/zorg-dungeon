; Export presets for milestone 1 (ADR-0008). No keystore or credential is
; stored here: CI makes a throwaway debug keystore at run time and passes it
; through GODOT_ANDROID_KEYSTORE_DEBUG_* environment variables.

[preset.0]

name="Linux"
platform="Linux"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="levels/*.json"
exclude_filter="tests/*"
export_path="build/linux/zorg.x86_64"

[preset.0.options]

binary_format/embed_pck=true
binary_format/architecture="x86_64"

[preset.1]

name="Android"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="levels/*.json"
exclude_filter="tests/*"
export_path="build/android/zorg-debug.apk"

[preset.1.options]

gradle_build/use_gradle_build=false
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
package/unique_name="link.artof.zorg"
package/name="Zorg's Dungeon Maker"
package/signed=true
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
version/code=1
version/name="0.1.0-milestone1"
